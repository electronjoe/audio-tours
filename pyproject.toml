[project]
name = "audiotour"
version = "0.1.0"
description = "Generate GPS-triggered driving audio tours with the ElevenLabs API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
tour = "audiotour.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiotour"]

[tool.pytest.ini_options]
testpaths = ["tests"]
